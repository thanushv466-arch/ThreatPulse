id: SEN-002
title: Password spraying
description: One source tries to log in as many different users, a few attempts each.
severity: high
type: threshold
match:
  action: ssh_login
  outcome: failure
group_by: src_ip
distinct: user
window: 600
count: 6
suppress: 1800
mitre:
  tactic: Credential Access
  technique: T1110.003
  name: "Brute Force: Password Spraying"
explain: >
  Instead of trying 1,000 keys on one door, the burglar tries one common key
  ("Summer2026!") on 1,000 doors. Each door only sees one attempt, so lockout
  counters never trip. You only see it by watching the whole street.
false_positives:
  - A jump host or NAT gateway that many real users share
response:
  - Identify which accounts were targeted and force a reset for any with weak passwords
  - Block the source address
  - Check identity provider logs for the same source
